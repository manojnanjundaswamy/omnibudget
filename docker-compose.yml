version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: omnibudget-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: omnibudget
      POSTGRES_USER: omniuser
      POSTGRES_PASSWORD: omnipassword
    ports:
      - "5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniuser -d omnibudget"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: omnibudget-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/omnibudget
      SPRING_DATASOURCE_USERNAME: omniuser
      SPRING_DATASOURCE_PASSWORD: omnipassword
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SERVER_PORT: 8088
    ports:
      - "8088:8088"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: omnibudget-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5174:80"
      - "3000:80"

volumes:
  pgdata:
