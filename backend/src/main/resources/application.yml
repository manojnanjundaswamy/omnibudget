server:
  port: 8088

spring:
  application:
    name: omnibudget-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5435/omnibudget}
    driverClassName: org.postgresql.Driver
    username: ${SPRING_DATASOURCE_USERNAME:omniuser}
    password: ${SPRING_DATASOURCE_PASSWORD:omnipassword}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

logging:
  level:
    root: INFO
    com.omnibudget: INFO
